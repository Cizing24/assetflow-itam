services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: assetflow
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://assetflow:${POSTGRES_PASSWORD}@db:5432/assetflow?schema=public
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      DEMO_SEED: ${DEMO_SEED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && node apps/api/dist/server.js"]
volumes:
  postgres_data:
